apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-openfaas-worker
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-openfaas-worker
  template:
    metadata:
      labels:
        app: temporal-openfaas-worker
    spec:
      containers:
        - name: worker
          image: temporal-openfaas-worker:dev
          imagePullPolicy: IfNotPresent