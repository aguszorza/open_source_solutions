server:
  replicaCount: 1

  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4

      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: temporal-postgresql.temporal.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            password: temporal

        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-postgresql.temporal.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            password: temporal

  frontend:
    enabled: true

  history:
    enabled: true

  matching:
    enabled: true

  worker:
    enabled: true

web:
  enabled: true

schema:
  useHelmHooks: true